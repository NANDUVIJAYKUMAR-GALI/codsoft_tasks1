<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatty — a rule-based bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F2A; --panel:#222736; --border:#333C4F;
    --text:#E8E6DD; --dim:#8B93A7; --accent:#FFB454;
    --user-bubble:#3A4A5C; --bot-bubble:#2B3245;
    --font-mono:'IBM Plex Mono',monospace; --font-sans:'IBM Plex Sans',sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F3F1EA; --panel:#FFFFFF; --border:#DCD8CC;
      --text:#20232B; --dim:#6B6F7A; --accent:#C97A2B;
      --user-bubble:#20232B; --bot-bubble:#EDEAE0;
    }
    :root:not([data-theme="dark"]) .user .bubble{ color:#F3F1EA; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans);
    display:flex; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .app{
    width:100%; max-width:560px; height:100%; max-height:760px;
    display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    margin:16px; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:10px;
    padding:16px 18px; border-bottom:1px solid var(--border);
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  header h1{ font-size:15px; font-weight:600; margin:0; }
  header p{ margin:0; font-size:12px; color:var(--dim); }
  .log{
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
    font-family:var(--font-mono); font-size:13.5px; line-height:1.5;
  }
  .row{ display:flex; }
  .row.user{ justify-content:flex-end; }
  .bubble{
    max-width:78%; padding:9px 13px; border-radius:5px; white-space:pre-wrap;
  }
  .bot .bubble{ background:var(--bot-bubble); border:1px solid var(--border); }
  .user .bubble{ background:var(--user-bubble); color:#F3F1EA; }
  .label{ font-size:10.5px; color:var(--dim); margin-bottom:3px; font-family:var(--font-sans); }
  form{
    display:flex; gap:8px; padding:14px; border-top:1px solid var(--border);
  }
  input{
    flex:1; background:transparent; border:1px solid var(--border); border-radius:5px;
    padding:10px 12px; color:var(--text); font-family:var(--font-sans); font-size:14px; outline:none;
  }
  input:focus{ border-color:var(--accent); }
  button{
    background:var(--accent); color:#1B1F2A; border:none; border-radius:5px;
    padding:0 18px; font-family:var(--font-sans); font-weight:600; font-size:14px; cursor:pointer;
  }
  button:active{ opacity:.85; }
  .log::-webkit-scrollbar{ width:8px; }
  .log::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot"></span>
    <div>
      <h1>Chatty</h1>
      <p>a small rule-based bot &middot; pattern matching only, no AI</p>
    </div>
  </header>
  <div class="log" id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Say something…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<script>
let userName = null;

const rules = [
  [/\b(hi|hello|hey|greetings)\b/, () => pick([
    "Hello there! How can I help you today?",
    "Hi! What's on your mind?",
    "Hey! Good to see you."
  ])],
  [/\bmy name is (\w+)/, m => {
    userName = capitalize(m[1]);
    return `Nice to meet you, ${userName}!`;
  }],
  [/what'?s? is your name|what is your name/, () =>
    pick(["I'm Chatty, your friendly rule-based bot.", "You can call me Chatty."])],
  [/\bhow are you\b/, () =>
    pick(["I'm just a program, but I'm running smoothly! How about you?", "Doing great, thanks for asking!"])],
  [/\b(what time|current time)\b/, () =>
    `The current time is ${new Date().toLocaleTimeString()}.`],
  [/\b(what day|today.?s date|current date)\b/, () =>
    `Today's date is ${new Date().toLocaleDateString()}.`],
  [/\btell me a joke\b/, () => pick([
    "Why don't programmers like nature? Too many bugs.",
    "I told my computer I needed a break, and it froze.",
    "Why do Java developers wear glasses? Because they don't see sharp."
  ])],
  [/\b(help|what can you do)\b/, () =>
    "I can chat about simple things: greetings, your name, the time/date, tell a joke, or say bye when you're done. Try asking 'tell me a joke'!"],
  [/\b(thanks|thank you)\b/, () => pick(["You're welcome!", "No problem at all!", "Anytime!"])],
  [/\b(bye|goodbye|see you|exit|quit)\b/, () =>
    `Goodbye${userName ? ", " + userName : ""}! Have a great day.`],
];

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function getResponse(raw){
  const text = raw.toLowerCase().trim();
  if(!text) return "Please say something so I have a chance to respond!";
  for(const [pattern, handler] of rules){
    const match = text.match(pattern);
    if(match) return handler(match);
  }
  return pick([
    "I'm not sure I understand. Could you rephrase that?",
    "Interesting, but I don't have a rule for that yet.",
    "Hmm, I don't know how to respond to that. Try 'help' to see what I can do."
  ]);
}

const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');

function addMessage(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = who === 'user' ? 'you' : 'chatty';
  const content = document.createElement('div');
  content.textContent = text;
  const wrap = document.createElement('div');
  wrap.appendChild(label);
  wrap.appendChild(content);
  bubble.appendChild(wrap);
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value;
  if(!text.trim()) return;
  addMessage(text, 'user');
  input.value = '';
  setTimeout(() => addMessage(getResponse(text), 'bot'), 200);
});

addMessage("Hi! I'm Chatty, a simple rule-based bot. Type 'help' to see what I can do.", 'bot');
</script>
</body>
</html>
